<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Haraka</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/logo_haraka_trans.png" />
  <style>
    /* Presentation view: the real Haraka app running inside a phone, nothing else on screen */
    :root { --bg1: #eef1f6; --bg2: #dfe4ec; --frame: #111317; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: radial-gradient(ellipse at 50% 30%, var(--bg1), var(--bg2));
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    }
    .stage { transform-origin: center center; }
    .phone {
      position: relative; width: 417px; height: 876px; padding: 12px;
      background: var(--frame); border-radius: 64px;
      box-shadow: 0 0 0 2px #2b2f36, 0 0 0 4px #0b0c0f, 0 40px 80px -20px rgba(15, 23, 42, .45), 0 18px 36px -18px rgba(15, 23, 42, .35);
    }
    /* side buttons */
    .phone::before, .phone::after { content: ""; position: absolute; width: 4px; background: #23262c; border-radius: 2px; }
    .phone::before { left: -6px; top: 180px; height: 64px; box-shadow: 0 84px 0 #23262c; }
    .phone::after { right: -6px; top: 230px; height: 96px; }
    .screen {
      position: relative; width: 393px; height: 852px; border-radius: 52px; overflow: hidden; background: #fff;
      display: flex; flex-direction: column;
    }
    .status {
      height: 54px; flex: none; display: flex; align-items: center; justify-content: space-between;
      padding: 0 34px 0 44px; font-size: 16px; font-weight: 600; color: #0f172a; background: #fff; position: relative; z-index: 2;
    }
    .island { position: absolute; left: 50%; top: 11px; width: 124px; height: 36px; margin-left: -62px; background: #000; border-radius: 20px; }
    .icons { display: flex; gap: 6px; align-items: center; }
    iframe { flex: 1; width: 100%; border: 0; display: block; background: #fff; }
    .home-bar { height: 30px; flex: none; background: #fff; display: flex; align-items: center; justify-content: center; }
    .home-bar span { width: 136px; height: 5px; border-radius: 3px; background: #0f172a; }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="phone">
      <div class="screen">
        <div class="status">
          <span id="clock">9:41</span>
          <div class="island"></div>
          <div class="icons" aria-hidden="true">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="#0f172a"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="#0f172a"/><rect x="10" y="3" width="3" height="9" rx="1" fill="#0f172a"/><rect x="15" y="0" width="3" height="12" rx="1" fill="#0f172a"/></svg>
            <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 5.6 8.9a3.4 3.4 0 0 1 4.8 0zM3.5 6.8a6.4 6.4 0 0 1 9 0l1.4-1.5a8.5 8.5 0 0 0-11.8 0zM.7 3.9a10.5 10.5 0 0 1 14.6 0L16 3.2l-.7-.7a12.5 12.5 0 0 0-14.6 0L0 3.2z" fill="#0f172a"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#0f172a" opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2" fill="#0f172a"/><rect x="25" y="4.5" width="1.5" height="4" rx=".75" fill="#0f172a" opacity=".4"/></svg>
          </div>
        </div>
        <iframe src="/?native" title="Haraka app" allow="camera; microphone; geolocation; clipboard-write; autoplay"></iframe>
        <div class="home-bar"><span></span></div>
      </div>
    </div>
  </div>
  <script>
    // Scale the phone to fit any screen or projector, never larger than real size
    function fit() {
      var s = Math.min(1, (window.innerHeight - 32) / 900, (window.innerWidth - 32) / 440);
      document.getElementById('stage').style.transform = 'scale(' + s + ')';
    }
    fit();
    window.addEventListener('resize', fit);
    function tick() {
      var d = new Date();
      document.getElementById('clock').textContent = (d.getHours() % 12 || 12) + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    tick();
    setInterval(tick, 15000);
  </script>
</body>
</html>
