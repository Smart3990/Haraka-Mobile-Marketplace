      /* Universally hide scrollbars so the phone simulator and all elements look 100% native */
      *, *::before, *::after {

        -ms-overflow-style: none !important;
      }
      ::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;

        display: none !important;
        background: transparent !important;
      }
      ::-webkit-scrollbar-thumb {
        display: none !important;
        background: transparent !important;
      }
      ::-webkit-scrollbar-button {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
    </style>
