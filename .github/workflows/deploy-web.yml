# Publishes the website (https://harakaapp.web.app) and the database rules every time main is pushed.
# Needs one repository secret (Settings > Secrets and variables > Actions):
#   FIREBASE_TOKEN — from running `npx firebase-tools login:ci` on a computer logged in to the Firebase project
# The Android APK is separate and still only builds when "Android APK" is run by hand.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push replaces a deploy that is still running
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Firebase Hosting and Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "::error::Add the FIREBASE_TOKEN repository secret (see the top of this file)."
            exit 1
          fi
          npx --yes firebase-tools@15.34.1 deploy --only hosting,firestore:rules \
            --project ga4-viewer-kiyumart-platform --non-interactive

      # The new rules must really be live: anyone may look up a disabled account, so a missing one is
      # "not found" (404). Old rules refuse it (403), which means the rules were not released.
      - name: Check the database rules are live
        run: |
          KEY=$(node -p "require('./firebase-applet-config.json').apiKey")
          DB=$(node -p "require('./firebase-applet-config.json').firestoreDatabaseId")
          sleep 20
          CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://firestore.googleapis.com/v1/projects/ga4-viewer-kiyumart-platform/databases/$DB/documents/disabledUsers/deploy-check?key=$KEY")
          echo "Rules check returned $CODE"
          if [ "$CODE" != "404" ]; then
            echo "::error::The Firestore rules are not live (expected 404, got $CODE)."
            exit 1
          fi
