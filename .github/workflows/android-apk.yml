# Builds the Android APK on GitHub's servers (free), signed with the app's existing key stored on Expo.
# Run it from GitHub: Actions > "Android APK" > Run workflow. The APK is attached to the run when it finishes.
# Needs one repository secret holding an Expo access token, named HARAKA_APK (or EXPO_TOKEN) (expo.dev > Account settings > Access tokens).
name: Android APK

on:
  workflow_dispatch:

jobs:
  build:
    # Ubuntu 24.04 already includes the Android SDK (ubuntu-latest is moving to Ubuntu 26)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17


      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.HARAKA_APK || secrets.EXPO_TOKEN }}

      - name: Use the preinstalled Android SDK
        run: echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Build APK
        env:
          EAS_SKIP_AUTO_FINGERPRINT: 1
          EXPO_TOKEN: ${{ secrets.HARAKA_APK || secrets.EXPO_TOKEN }}
        run: eas build --platform android --profile preview --local --non-interactive --output haraka.apk

      - uses: actions/upload-artifact@v4
        with:
          name: haraka-apk
          path: haraka.apk
          retention-days: 30
